[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuittrim"
version = "1.0.0"
description = "Simplify small quantum circuits and verify their full operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Swayam Shakya"}]
keywords = ["quantum", "circuits", "education", "optimization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipywidgets>=8,<9"]
dev = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "ipywidgets>=8,<9", "Pillow>=10,<13", "CairoSVG>=2.7,<3", "build>=1,<2"]

[project.scripts]
circuittrim = "circuittrim.cli:main"

[tool.setuptools]
packages = ["circuittrim"]
